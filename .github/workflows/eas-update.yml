name: Publish EAS Update

on:
  push:
    branches:
      - main # Make sure this matches your default branch name

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Install dependencies
        run: |
          cd mobile
          npm install

      - name: Publish Update
        run: |
          cd mobile
          npx eas-cli update --branch production --message "GitHub Commit: ${{ github.event.head_commit.message }}"
